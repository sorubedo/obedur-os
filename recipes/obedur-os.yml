---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: obedur-os
description: This is my personal OS image.

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

modules:
  - from-file: modules/bootstrap.yml

  - from-file: modules/cachyos-kernel.yml

  - from-file: modules/core.yml

  - from-file: modules/cachyos-extras.yml

  - type: oobe
    source: local
    exec: dbus-run-session niri
    env:
      NIRI_CONFIG: /usr/share/obedur-dotfiles/niri/oobe.kdl

  - from-file: modules/finalize.yml
