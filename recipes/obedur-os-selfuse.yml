---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: obedur-os-selfuse
description: This is my personal self-use OS image.

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

modules:
  - from-file: modules/bootstrap.yml

  - from-file: modules/cachyos-kernel-nvidia.yml

  - type: dnf
    repos:
      copr:
        - sorubedo/niri-pull3800-git
  - type: script
    snippets:
      - 'echo "priority=1" | sudo tee -a /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sorubedo:niri-pull3800-git.repo'

  - from-file: modules/core.yml

  - from-file: modules/cachyos-extras.yml

  - type: dnf
    repos:
      copr:
        - lizardbyte/beta
        - alternateved/keyd
      nonfree: rpmfusion
    install:
      packages:
        - wayvnc
        - ayugram-desktop
        - Sunshine
        - keyd
        - prismlauncher-nightly

  - type: script
    snippets:
      - "setcap cap_sys_admin+p $(readlink -f $(which sunshine))"

  - type: systemd
    system:
      enabled:
        - keyd.service

  - from-file: modules/finalize.yml
